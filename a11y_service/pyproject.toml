[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wcag-accessibility-agent"
version = "0.1.0"
description = "WCAG-grounded accessibility review agent (hybrid retrieval + evidence-constrained LLM)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "langgraph>=0.2",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.0",
  "qdrant-client>=1.9",
  "openai>=1.30",
  "httpx>=0.27",
  "streamlit>=1.33",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads real ML models (deselect with -m 'not slow')"]
